  points:['Liệt kê tất cả cách có thể gây thất bại/xấu','Thiết kế để loại bỏ những cái đó','Pre-mortem: "Tưởng tượng dự án đã thất bại — tại sao?"','Charlie Munger: "Nói với tôi nơi tôi sẽ chết, để tôi không đến đó"'],
  example:'"Làm sao làm khách hàng hài lòng?"\n→ ĐẢO NGƯỢC: "Điều gì sẽ chắc chắn làm khách hàng tức giận?"\n→ Danh sách: giao hàng trễ, sản phẩm lỗi, CS tệ\n→ Tránh tất cả những cái đó\n\nMunger: "Tôi muốn biết nơi mình sẽ chết, để tôi không bao giờ đến đó"\n→ Pre-mortem analysis',
  formula:'X = goal. Enumerate causes(¬X). Avoid all causes(¬X). ≈ achieve X.',
  related:['Critical Thinking','Second-order Thinking','Mental Models']},

{id:63,cat:'c7',core:true,
  title:'Tập hợp và quan hệ',en:'Sets and Relations',
  tagline:'Nền tảng của logic hiện đại: tập hợp, phần tử, và quan hệ giữa chúng',
  notation:'∈, ⊆, ∩, ∪, ∅, Aᶜ',
  desc:'Lý thuyết tập hợp (Cantor) cung cấp ngôn ngữ toán học cơ bản cho logic hiện đại. Khái niệm tập hợp, quan hệ thuộc về, giao, hợp, phần bù là nền tảng của tất cả toán học và logic hình thức.',
  points:['Tập hợp: nhóm các phần tử phân biệt','Quan hệ: ∈ (thuộc về), ⊆ (tập con), = (bằng nhau)','Phép toán: ∩ (giao), ∪ (hợp), A\\B (hiệu), Aᶜ (bù)','Venn diagram: công cụ trực quan cho tập hợp'],
  example:'A = {1, 2, 3}, B = {2, 3, 4}\nA ∩ B = {2, 3} (phần tử chung)\nA ∪ B = {1, 2, 3, 4} (tất cả)\nA\\B = {1} (trong A không trong B)\n\nỨng dụng logic:\n"Mọi chó đều là động vật": Dogs ⊆ Animals\n"Socrates là người": Socrates ∈ Humans',
  formula:'A∩B = {x | x∈A ∧ x∈B}\nA∪B = {x | x∈A ∨ x∈B}',
  related:['Logic vị từ','Lượng từ','Toán học']},

{id:64,cat:'c7',
  title:'Hệ thống Tiên đề',en:'Axiomatic Systems',
  tagline:'Xây dựng toán học từ nền tảng không thể phủ nhận',
  notation:'Axioms → Theorems (via valid proofs)',
  desc:'Hệ thống tiên đề (axiomatic system) bắt đầu từ một tập hợp nhỏ các tiên đề (giả định không cần chứng minh) và xây dựng toàn bộ hệ thống qua chứng minh hợp lệ. Euclid là người đầu tiên áp dụng cho hình học.',
  points:['Tiên đề: giả định nền tảng được chấp nhận không cần chứng minh','Định lý: được chứng minh từ tiên đề và định lý trước','Tính nhất quán: không thể suy ra mâu thuẫn từ hệ thống','Tính đầy đủ: mọi mệnh đề đúng đều có thể chứng minh'],
  example:'Euclid 5 tiên đề hình học → toàn bộ hình học phẳng\nTiên đề 5 (parallel): mỗi đường thẳng và điểm ngoài nó,\nchỉ có đúng một đường song song qua điểm đó\n→ Thay đổi tiên đề 5 → hình học phi Euclid!\n\nZFC (Zermelo-Fraenkel + Choice):\nNền tảng tiên đề của toàn bộ toán học hiện đại',
  formula:'Well-formed axiomatic system: consistent + complete',
  related:['Chứng minh trực tiếp','Logic toán học','Định lý bất toàn Gödel']},

{id:65,cat:'c7',
  title:'Định lý bất toàn Gödel',en:"Gödel's Incompleteness Theorems",
  tagline:'Mọi hệ thống tiên đề đủ mạnh đều có mệnh đề đúng nhưng không thể chứng minh',
  notation:'∃P: P true ∧ P unprovable (in consistent system)',
  desc:'Năm 1931, Kurt Gödel chứng minh rằng bất kỳ hệ thống tiên đề nhất quán nào đủ mạnh để diễn tả số học đều có những mệnh đề đúng nhưng không thể chứng minh trong hệ thống đó. Đây là một trong những khám phá toán học vĩ đại nhất.',
  points:['Định lý 1: Mọi hệ thống đủ mạnh đều bất toàn','Định lý 2: Không thể chứng minh nhất quán của hệ thống từ bên trong','Giới hạn cơ bản của toán học và logic hình thức','Có ý nghĩa triết học sâu sắc về giới hạn tri thức'],
  example:'Mệnh đề Gödel (G): "Mệnh đề này không thể chứng minh"\nNếu G chứng minh được → mệnh đề nói mình không chứng minh được → mâu thuẫn!\nNếu G không chứng minh được → G đúng! → hệ thống bất toàn\n\n→ Giống Liar Paradox: "Câu này là sai"\nMọi hệ thống đủ phức tạp đều có "điểm mù" như thế này',
  formula:'Consistent(S) ∧ Sufficient(S) → ∃G: True(G) ∧ ¬Provable_S(G)',
  related:['Hệ thống Tiên đề','Logic toán học','Nghịch lý']},

{id:66,cat:'c7',
  title:'Logic mệnh đề',en:'Propositional Logic',
  tagline:'Hệ thống hình thức nghiên cứu quan hệ logic giữa các mệnh đề',
  notation:'PL: {P, Q, R, ∧, ∨, ¬, →, ↔}',
  desc:'Logic mệnh đề (propositional logic, zero-order logic) là hệ thống hình thức cơ bản nhất nghiên cứu quan hệ logic giữa các mệnh đề thông qua liên từ logic. Nó không quan tâm đến nội dung bên trong mệnh đề.',
  points:['Ngôn ngữ: mệnh đề nguyên tử + liên từ','Semantic: bảng chân trị','Syntactic: hệ thống chứng minh (axioms + rules)','Soundness và Completeness: PL là cả hai'],
  example:'Formalize lập luận:\n"Nếu học chăm hoặc tài năng, sẽ thành công.\nBạn không thành công.\nVậy bạn không học chăm và không tài năng."\n\n(H ∨ T) → S\n¬S\n⊢ ¬H ∧ ¬T\n\nBy MT: ¬S → ¬(H∨T) ≡ ¬H∧¬T ✓',
  formula:'Soundness: ⊢P → ⊨P\nCompleteness: ⊨P → ⊢P',
  related:['Mệnh đề','Liên từ logic','Logic vị từ']},

{id:67,cat:'c7',
  title:'Logic vị từ',en:'Predicate (First-order) Logic',
  tagline:'Mở rộng logic mệnh đề với lượng từ và biến',
  notation:'FOL: ∀x, ∃x, P(x), P(a,b)',
  desc:'Logic vị từ bậc nhất (FOL, first-order logic) mở rộng logic mệnh đề bằng cách thêm lượng từ (∀, ∃), biến, và vị từ (predicates). Đây là hệ thống logic mạnh nhất được dùng rộng rãi trong toán học và khoa học máy tính.',
  points:['Vị từ: P(x) — tính chất hoặc quan hệ','Hằng: a, b — đại diện cụ thể','Biến: x, y — đại diện bất kỳ phần tử nào','Lượng từ: ∀, ∃ — phát biểu về toàn bộ hoặc tồn tại'],
  example:'"Mọi người đều có cha mẹ":\n∀x (Person(x) → ∃y∃z (Father(y,x) ∧ Mother(z,x)))\n\n"Có người không ai yêu":\n∃x (Person(x) ∧ ¬∃y Loves(y,x))\n\nTam đoạn luận Socrates:\n∀x (Human(x) → Mortal(x))\nHuman(Socrates)\n⊢ Mortal(Socrates)',
  formula:'FOL = PL + Predicates + Quantifiers + Variables',
  related:['Logic mệnh đề','Lượng từ','Tập hợp và quan hệ']},

{id:68,cat:'c7',
  title:'Logic Modal',en:'Modal Logic',
  tagline:'Logic về tính tất yếu (□) và khả năng (◇)',
  notation:'□P (necessarily P), ◇P (possibly P)',
  desc:'Logic modal mở rộng logic mệnh đề với hai toán tử: □ (necessity — tất yếu) và ◇ (possibility — khả năng). Được dùng trong triết học, AI, và lý luận về trạng thái hệ thống.',
  points:['□P: P đúng trong mọi thế giới có thể (necessarily)','◇P: P đúng trong ít nhất một thế giới có thể (possibly)','□P → P và P → ◇P','Deontic logic: □ cho "bắt buộc", ◇ cho "được phép"'],
  example:'□(2+2=4): tất yếu đúng (toán học)\n◇(có sự sống trên sao Hỏa): có thể đúng\n¬◇(tồn tại vòng tròn vuông): không thể\n\nDeontic (nghĩa vụ):\n□(không được giết người): bắt buộc\n◇(ăn kem): được phép\n\nEpistemology:\n□(tôi biết P): tôi biết chắc P\n◇(P có thể đúng): P có thể đúng với kiến thức hiện tại',
  formula:'□P ≡ ¬◇¬P\n◇P ≡ ¬□¬P',
  related:['Logic mệnh đề','Nhận thức luận','Triết học']},

{id:69,cat:'c7',
  title:'Logic mờ',en:'Fuzzy Logic',
  tagline:'Giá trị chân lý liên tục từ 0 đến 1 thay vì chỉ 0 hoặc 1',
  notation:'T(P) ∈ [0,1] not just {0,1}',
  desc:'Logic mờ (Lotfi Zadeh, 1965) mở rộng logic cổ điển cho phép giá trị chân lý liên tục từ 0 đến 1, phản ánh tốt hơn sự mơ hồ trong ngôn ngữ tự nhiên và thực tế. Rất hữu ích trong hệ thống điều khiển.',
  points:['T(P) = 0.7 nghĩa là P "khá đúng"','Vague predicates: "cao", "nóng", "trẻ" có giá trị liên tục','Sorites Paradox: 1 hạt không phải đống, +1 hạt = đống?','Ứng dụng: điều hòa nhiệt độ, máy giặt thông minh, AI'],
  example:'"Anh ta cao" — chiều cao 1.75m\nLogic cổ điển: cao hay không cao? (cần ngưỡng cứng)\nLogic mờ: T("cao", 1.75m) = 0.6 — khá cao\n\nSorites Paradox:\n1 hạt gạo không phải đống ✓\n2 hạt không phải đống ✓\n... thêm 1 hạt lúc nào thành đống?\n→ Ranh giới mờ — fuzzy logic xử lý tốt',
  formula:'T(¬P) = 1 - T(P)\nT(P∧Q) = min(T(P), T(Q))',
  related:['Logic mệnh đề','Luật bài trung','Nghịch lý']},

{id:70,cat:'c7',
  title:'Nghịch lý Logic',en:'Logical Paradoxes',
  tagline:'Mệnh đề tự mâu thuẫn hoặc dẫn đến mâu thuẫn từ giả định hợp lý',
  notation:'Liar: L = "This statement is false"',
  desc:'Nghịch lý logic là mệnh đề hoặc tập hợp mệnh đề hợp lý dẫn đến kết luận mâu thuẫn. Chúng tiết lộ giới hạn của hệ thống logic và thúc đẩy sự phát triển của lý thuyết mới.',
  points:['Liar Paradox: "Câu này là sai" — nếu đúng thì sai, nếu sai thì đúng','Russell Paradox: tập hợp tất cả tập hợp không chứa chính nó','Barber Paradox: người thợ cạo cạo râu cho tất cả người không tự cạo','Giải quyết: lý thuyết kiểu (type theory), logic phân cấp'],
  example:'Liar Paradox:\nL: "Câu L là sai"\nNếu L đúng → nội dung L đúng → L sai → mâu thuẫn!\nNếu L sai → nội dung L sai → L đúng → mâu thuẫn!\n\nBarber Paradox:\n"Người thợ cạo cạo râu cho tất cả người trong làng không tự cạo"\n→ Ai cạo râu cho thợ cạo?\nNếu tự cạo → là người tự cạo → không cạo\nNếu không cạo → là người không tự cạo → phải cạo → mâu thuẫn!',
  formula:'Resolution: eliminate self-reference or use type hierarchy',
  related:['Tự mâu thuẫn','Định lý bất toàn Gödel','Logic mờ']},

{id:71,cat:'c7',
  title:'Tính toán và Thuật toán',en:'Computability and Algorithms',
  tagline:'Ranh giới giữa cái có thể và không thể tính toán',
  notation:'Turing Machine, Halting Problem',
  desc:'Alan Turing (1936) thiết lập lý thuyết tính toán: máy Turing, vấn đề dừng (halting problem), và giới hạn cơ bản của những gì có thể tính toán được. Đây là nền tảng của khoa học máy tính và logic tính toán.',
  points:['Halting Problem: không có thuật toán tổng quát nào xác định được liệu chương trình có dừng không','Church-Turing Thesis: mọi hàm tính được đều tính được bằng Turing machine','P vs NP: vấn đề lớn nhất chưa giải của khoa học máy tính','Decidability: một số vấn đề không thể giải được về nguyên tắc'],
  example:'Halting Problem (không thể giải):\n"Cho chương trình P và input I, liệu P(I) có dừng không?"\n→ Không có thuật toán nào trả lời được trong mọi trường hợp\n(Turing chứng minh bằng diagonalization)\n\nP vs NP:\nP: giải nhanh (polynomial time)\nNP: kiểm tra nhanh nhưng giải không rõ nhanh không\n"P = NP?" → $1,000,000 prize chưa được giải',
  formula:'P ⊆ NP; P = NP? unknown',
  related:['Hệ thống Tiên đề','Định lý bất toàn Gödel','Logic toán học']},

{id:72,cat:'c7',
  title:'Lý thuyết trò chơi',en:'Game Theory',
  tagline:'Logic của quyết định chiến lược khi kết quả phụ thuộc lẫn nhau',
  notation:'Nash Equilibrium: ∀i, no player benefits by deviating',
  desc:'Lý thuyết trò chơi (Von Neumann & Morgenstern) nghiên cứu ra quyết định chiến lược trong các tình huống mà kết quả của một người phụ thuộc vào quyết định của người khác. Nash Equilibrium là khái niệm trung tâm.',
  points:['Nash Equilibrium: trạng thái không ai muốn thay đổi đơn phương','Zero-sum: một người thắng = người kia thua','Positive-sum: cả hai có thể cùng có lợi','Prisoner\'s Dilemma: lợi ích cá nhân ≠ lợi ích tập thể'],
  example:"Prisoner's Dilemma:\n        | Im Lair | Betray\n---------------------------------------\nIm Lair | (3,3)   | (0,5)\nBetray  | (5,0)   | (1,1) ← Nash Equilibrium\n\nCả hai phản bội dù cùng khai là tốt hơn!\n→ Tại sao? Hợp tác là unstable nếu không có cam kết binding\n\nỨng dụng: đấu giá 5G, chính sách thương mại, quân sự",
  formula:'NE: ∀i: si* ∈ argmax ui(si, s₋i*)',
  related:['Logic quyết định','Nhân quả','Lý luận thực tiễn']},

{id:73,cat:'c8',core:true,
  title:'Tri thức và niềm tin',en:'Knowledge vs Belief',
  tagline:'Tri thức = niềm tin đúng được biện hộ (Plato) — hay nhiều hơn thế?',
  notation:'K(P) = JTB: Justified True Belief',
  desc:'Nhận thức luận hỏi: tri thức là gì và chúng ta có thể biết gì? Định nghĩa cổ điển của Plato: tri thức là niềm tin đúng được biện hộ (JTB). Gettier (1963) chứng minh JTB không đủ.',
  points:['Niềm tin (Belief): chấp nhận P là đúng','Đúng (Truth): P thực sự đúng','Biện hộ (Justification): có lý do tốt để tin P','Gettier Problem: JTB không đủ — có thể có JTB mà không có tri thức'],
  example:'Gettier Case:\nBạn nhìn đồng hồ (dừng lúc 3h), đồng hồ hiện 3h, và thực sự đang là 3h\n→ Bạn có JTB: "Bây giờ là 3h"\nNhưng: đồng hồ đã dừng và bạn nhìn đúng lúc 3h = may mắn!\n→ Có phải tri thức thực sự không? Hầu hết nói "không"\n\nTriết học hiện đại: tri thức cần thêm điều kiện "không phải may mắn"',
  formula:'Plato: K(P) = B(P) ∧ T(P) ∧ J(P)\nGettier: JTB is insufficient for K',
  related:['Nhận thức luận','Skepticism','Intellectual Humility']},

{id:74,cat:'c8',
  title:'Hoài nghi luận',en:'Philosophical Skepticism',
  tagline:'Có thể chúng ta không biết được gì cả — hay ít ra là ít hơn ta nghĩ',
  notation:'¬K(P) for most/all P?',
  desc:'Hoài nghi luận triết học đặt câu hỏi về khả năng tri thức thực sự. Từ hoài nghi cổ đại (Pyrrho) đến Descartes và ác quỷ lừa dối, đến hoài nghi hiện đại — liệu chúng ta có thể thực sự biết bất cứ điều gì?',
  points:['Hoài nghi Descartes: "Tôi nghĩ vậy tôi tồn tại" (cogito ergo sum)','Evil Demon scenario: điều gì nếu mọi giác quan bị lừa dối?','Brain in a vat: Nozick — không thể phân biệt','Pragmatic response: một số hoài nghi không thực tiễn'],
  example:'Descartes Method of Doubt:\n"Tôi có thể nghi ngờ tất cả — giác quan, toán học, thực tế\nNhưng không thể nghi ngờ rằng tôi đang suy nghĩ\n→ Cogito ergo sum: Tôi nghĩ, vậy tôi tồn tại"\n\nBrain in a Vat:\nGiả sử bạn chỉ là não trong hộp, được kích thích bởi máy tính\nMọi trải nghiệm đều giống hệt thực tế\n→ Làm sao bạn biết bạn không phải là não trong hộp?',
  formula:'Cartesian skepticism: ∀P: possibly ¬K(P)',
  related:['Tri thức và niềm tin','Falsifiability','Nhận thức luận']},

{id:75,cat:'c8',
  title:'Epistemic Justification',en:'Epistemic Justification',
  tagline:'Cái gì biến niềm tin thành niềm tin được biện hộ hợp lý?',
  notation:'Foundationalism, Coherentism, Reliabilism',
  desc:'Làm thế nào để niềm tin được biện hộ hợp lý? Ba lý thuyết chính: Foundationalism (có niềm tin cơ sở tự biện hộ), Coherentism (niềm tin biện hộ lẫn nhau), Reliabilism (niềm tin đến từ quy trình tin cậy).',
  points:['Foundationalism: tháp biện hộ trên nền móng tự chứng minh','Coherentism: mạng nhện — không có trung tâm','Reliabilism: Goldman — quy trình nhận thức tin cậy tạo tri thức','Regress problem: mọi biện hộ cần biện hộ khác → vô tận?'],
  example:'Descartes là Foundationalist: "cogito" là nền tảng tự biện hộ\n\nCoherentism: niềm tin X hợp lý vì phù hợp với Y, Z, W...\nNhưng: có thể có nhiều hệ thống nhất quán đều sai\n\nReliabilism:\n"Nhìn bầu trời xanh → tin bầu trời xanh" là biện hộ tốt\nvì cơ chế thị giác là đáng tin cậy (reliably truth-tracking)',
  formula:'Foundationalism: B1 → B2 → ... → Bn (self-evident)',
  related:['Tri thức và niềm tin','Hoài nghi luận','Nhận thức luận']},

{id:76,cat:'c8',
  title:'A priori vs A posteriori',en:'A priori and A posteriori Knowledge',
  tagline:'Tri thức không cần kinh nghiệm vs tri thức từ kinh nghiệm',
  notation:'A priori: independent of experience; A posteriori: dependent',
  desc:'Kant phân biệt hai loại tri thức: a priori (biết trước/không cần kinh nghiệm — toán học, logic) và a posteriori (biết sau/cần kinh nghiệm — khoa học, thực nghiệm). Cũng phân biệt phân tích vs tổng hợp.',
  points:['A priori: "2+2=4", "Mọi tam giác có 180°" — đúng không cần quan sát','A posteriori: "Bầu trời xanh", "Nước sôi ở 100°C" — cần kinh nghiệm','Analytic: đúng theo nghĩa — "Mọi bà chồng đều đã kết hôn"','Synthetic: thêm thông tin mới — "Trái Đất tròn"'],
  example:'A priori:\n"NẾU tất cả A là B, và tất cả B là C, THÌ tất cả A là C"\n→ Đúng mà không cần kiểm tra thực tế\n\nA posteriori:\n"DNA quyết định tính di truyền"\n→ Cần thực nghiệm để biết\n\nKant\'s synthetic a priori: "Không gian là 3 chiều"\n→ A priori (không cần đo) nhưng tổng hợp (thêm thông tin)?',
  formula:'A priori ∩ Analytic (Hume), but also: Synthetic a priori (Kant)',
  related:['Tri thức và niềm tin','Nhận thức luận','Logic toán học']},

{id:77,cat:'c8',
  title:'Tương đối luận nhận thức',en:'Epistemic Relativism',
  tagline:'Sự thật phụ thuộc vào quan điểm, văn hóa, hoặc khung tham chiếu?',
  notation:'T(P) relative to framework F',
  desc:'Tương đối luận nhận thức cho rằng sự thật hoặc biện hộ là tương đối — không có sự thật tuyệt đối, khách quan. Từ tương đối văn hóa đến quan điểm của Protagoras "Con người là thước đo của vạn vật".',
  points:['Protagoras: "Con người là thước đo mọi thứ"','Mạnh: mỗi người có quan điểm hợp lý từ góc nhìn của mình','Yếu: tự mâu thuẫn — "Tương đối luận là đúng" — đúng tương đối hay tuyệt đối?','Phân biệt: tương đối văn hóa (thực tế) và tương đối nhận thức (nguy hiểm)'],
  example:'"Trái đất quay quanh mặt trời" — Tương đối luận nói gì?\nNếu tương đối hoàn toàn → trong khung tham chiếu của người trung cổ, nó sai → không có sự thật khoa học!\n\nTự mâu thuẫn:\n"Không có sự thật tuyệt đối nào" — có phải là tuyệt đối đúng không?\nNếu đúng → bác bỏ chính nó\nNếu sai → có sự thật tuyệt đối!',
  formula:'Self-refuting: Relativism(R) is either absolutely true (⊥) or relative (?)',
  related:['Hoài nghi luận','Nhận thức luận','Falsifiability']},

{id:78,cat:'c8',
  title:'Nhận thức luận đức hạnh',en:'Virtue Epistemology',
  tagline:'Tri thức đến từ rèn luyện đức hạnh trí tuệ: tò mò, cởi mở, kiên nhẫn',
  notation:'Knowledge = product of intellectual virtues',
  desc:'Nhận thức luận đức hạnh (Sosa, Zagzebski) chuyển trọng tâm từ niềm tin sang người tạo ra niềm tin: tri thức là sản phẩm của việc thực hành các đức hạnh trí tuệ như tò mò, kiên nhẫn, cởi mở tư duy, và kiêm tốn.',
  points:['Intellectual virtues: tò mò, cởi mở, kiên nhẫn, kiêm tốn','Epistemic vices: vội vã kết luận, lười suy nghĩ, quá cứng nhắc','Reliable belief-forming processes track intellectual virtues','Đức hạnh trí tuệ có thể rèn luyện — không phải bẩm sinh'],
  example:'Nhà khoa học giỏi không chỉ có phương pháp đúng mà còn có:\n• Tò mò: hỏi câu hỏi tốt\n• Kiên nhẫn: làm thí nghiệm cẩn thận\n• Kiêm tốn: sẵn sàng bị chứng minh sai\n• Cởi mở: xem xét giả thuyết đối lập\n\nĐối lập với Epistemic Vice:\n• Vội vã: kết luận từ mẫu nhỏ\n• Thiên kiến xác nhận: chỉ tìm bằng chứng đồng ý\n• Kiêu ngạo: không chịu cập nhật',
  related:['Intellectual Humility','Tri thức và niềm tin','Critical Thinking']},

{id:79,cat:'c8',
  title:'Testimony và Social Epistemology',en:'Social Epistemology',
  tagline:'Phần lớn tri thức đến từ tin vào người khác — khi nào hợp lý?',
  notation:'K via testimony: trust conditions',
  desc:'Phần lớn tri thức của chúng ta đến không phải từ trực tiếp quan sát mà từ lời chứng thực (testimony) của người khác — thầy giáo, sách, chuyên gia. Khi nào hợp lý để tin vào lời chứng thực?',
  points:['Reductionism: chỉ tin testimony khi có lý do độc lập','Anti-reductionism: tin mặc định trừ khi có lý do ngờ vực','Expertise: nhận dạng chuyên gia thực sự quan trọng','Epistemic injustice: khi nhóm bị bỏ qua không đúng'],
  example:'Bạn không trực tiếp quan sát Thế chiến II\n→ Tin vào lịch sử/chứng nhân (testimony)\nKhi nào hợp lý? Khi:\n• Nhiều nguồn độc lập đồng thuận\n• Không có xung đột lợi ích rõ ràng\n• Phù hợp với hiểu biết tổng thể\n\nVaccine safety:\n→ 99.9% nhà khoa học đồng ý → testimony rất đáng tin\nvs. một bác sĩ duy nhất nói ngược lại (và có xung đột lợi ích)',
  related:['Tri thức và niềm tin','Appeal to Authority','Nhận thức luận']},

{id:80,cat:'c8',
  title:'Doxastic Voluntarism',en:'Doxastic Voluntarism',
  tagline:'Chúng ta có thể chọn tin vào điều gì không?',
  notation:'Can we choose to believe P?',
  desc:'Doxastic voluntarism hỏi liệu niềm tin có phải là tự nguyện không — liệu chúng ta có thể chọn tin vào điều gì đó. Hầu hết triết gia cho rằng niềm tin không hoàn toàn tự nguyện — bằng chứng buộc niềm tin.',
  points:['Involuntarism: không thể tự quyết định tin P chỉ vì muốn','Indirect control: ảnh hưởng niềm tin gián tiếp qua điều tra, tiếp xúc','Pascal\'s Wager gặp vấn đề: không thể "chọn" tin Chúa để đặt cược','Liên quan đến epistemic responsibility'],
  example:'Thử nghiệm:\nHãy thử TIN rằng trần nhà đang là sàn nhà\n→ Không thể đơn giản chọn tin điều đó!\n\nPascal\'s Wager vấn đề:\n"Đặt cược vào Chúa tồn tại — nếu đúng, lãi vô hạn"\nNhưng: không thể TIN chỉ vì muốn đặt cược\n\nTuy nhiên: gián tiếp có thể ảnh hưởng:\n• Tiếp xúc thông tin mới\n• Thay đổi môi trường văn hóa',
  related:['Tri thức và niềm tin','Nhận thức luận','Epistemic Justification']},

{id:81,cat:'c8',
  title:'Bản thể luận',en:'Ontology',
  tagline:'Nghiên cứu về bản chất của tồn tại: cái gì thực sự tồn tại?',
  notation:'∃x — what kinds of x?',
  desc:'Bản thể luận (ontology) là nhánh siêu hình học hỏi cái gì tồn tại, có những loại tồn tại nào, và cách chúng liên quan. Nó cung cấp nền tảng cho mọi khoa học và triết học.',
  points:['Realism: tồn tại vật chất độc lập với tâm trí','Idealism: tồn tại phụ thuộc vào tâm trí (Berkeley: "esse est percipi")','Nominalism: chỉ cá thể tồn tại, không phải universal','Abstract objects: số, tập hợp, logic có tồn tại không?'],
  example:'Số Pi có tồn tại không?\nPlatonism: Pi tồn tại trong thế giới trừu tượng độc lập với chúng ta\nNominalism: Pi chỉ là khái niệm hữu ích do con người tạo ra\n\nCây rơi trong rừng không ai nghe — có tiếng động không?\nRealism: có, rung động không khí tồn tại\nIdealism (Berkeley): không có tâm trí nào nhận thức → không tồn tại tiếng động',
  related:['Nhận thức luận','Triết học','Tương đối luận']},

{id:82,cat:'c8',
  title:'Tự do ý chí',en:'Free Will and Determinism',
  tagline:'Liệu quyết định của chúng ta có thực sự "tự do" hay đã được xác định?',
  notation:'Determinism vs Libertarian Free Will vs Compatibilism',
  desc:'Vấn đề tự do ý chí: liệu mọi sự kiện (kể cả quyết định của con người) có được xác định bởi nhân quả trước đó? Nếu vậy, "tự do" ý nghĩa gì? Ba lập trường chính: Determinism, Libertarianism, Compatibilism.',
  points:['Hard Determinism: mọi sự kiện có nguyên nhân → không có tự do','Libertarian Free Will: tồn tại tự do thực sự, thoát khỏi nhân quả','Compatibilism: tự do và tất định có thể cùng tồn tại (free = uncoerced)','Neuroscience: quyết định bắt đầu trong não trước khi "ý thức" — Libet'],
  example:'Libet Experiment (1983):\nNão "quyết định" uốn cổ tay 350ms TRƯỚC khi người đó có ý thức về ý định\n→ Hard Determinist: não làm, không phải "bạn"\n→ Compatibilist: "bạn" = não của bạn = không có mâu thuẫn\n\nCompatibilism:\n"Tự do" không phải là thoát khỏi nhân quả\nmà là hành động theo mong muốn mình mà không bị cưỡng ép',
  related:['Bản thể luận','Nhân quả','Triết học']},

{id:83,cat:'c9',core:true,
  title:'Đặt câu hỏi đúng',en:'Asking the Right Questions',
  tagline:'Câu hỏi hay quan trọng hơn câu trả lời hay',
  notation:'Q* → better_answer than Q → best_answer',
  desc:'Khả năng đặt câu hỏi đúng là kỹ năng tư duy thiết thực quan trọng nhất. Câu hỏi sai dẫn đến giải pháp tốt cho vấn đề sai. Einstein: "Nếu có 1 giờ để giải một vấn đề, tôi dành 55 phút để hiểu câu hỏi."',
  points:['Reframing: đổi khung câu hỏi để thấy góc nhìn mới','5 Whys: đào sâu đến nguyên nhân gốc rễ','Mức độ trừu tượng: đặt câu hỏi ở đúng mức độ cụ thể/trừu tượng','Closed vs Open: câu hỏi mở tạo không gian khám phá lớn hơn'],
  example:'VẤN ĐỀ: "Tại sao người ta không dùng sản phẩm của chúng tôi?"\n\nCâu hỏi sai: "Làm sao thuyết phục họ dùng?"\n→ Giả định sản phẩm đã tốt, chỉ cần thuyết phục\n\nCâu hỏi đúng hơn: "Tại sao họ không dùng? Jobs-to-be-done là gì?\nCó giải pháp nào tốt hơn không? Chúng ta đang giải đúng vấn đề chưa?"\n\nEinstein: 55 phút hiểu vấn đề + 5 phút giải quyết',
  formula:'Better questions → better problem framing → better solutions',
  related:['Socratic Method','First Principles','Critical Thinking']},

{id:84,cat:'c9',
  title:'Tư duy hệ thống',en:'Systems Thinking',
  tagline:'Nhìn thấy kết nối, vòng phản hồi và xu hướng trong hệ thống phức tạp',
  notation:'System = Stocks + Flows + Feedback Loops',
  desc:'Tư duy hệ thống (Donella Meadows) nhìn nhận thế giới qua lăng kính hệ thống: kho chứa (stocks), dòng chảy (flows), và vòng phản hồi (feedback loops). Hầu hết vấn đề phức tạp cần cách tiếp cận này.',
  points:['Reinforcing loops: khuếch đại (lãi kép, bong bóng)','Balancing loops: cân bằng (nhiệt độ phòng, dân số)','Delays: độ trễ gây ra dao động và quyết định sai','Leverage points: điểm can thiệp tạo thay đổi lớn nhất'],
  example:'Dân số thế giới:\nStock: số người\nInflow: sinh\nOutflow: chết\nReinforcing loop: nhiều người → nhiều sinh\nBalancing loop: nhiều người → ít tài nguyên → nhiều chết\n\nTại sao chính sách thường thất bại?\nVì: can thiệp vào stock, không phải flow hay feedback\n→ Leverage point: thay đổi cấu trúc hệ thống',
  formula:'dStock/dt = Inflow - Outflow (+ Feedback)',
  related:['Second-order Thinking','Nhân quả','Mental Models']},

{id:85,cat:'c9',
  title:'Mô hình tư duy',en:'Mental Models',
  tagline:'Lăng kính giúp hiểu thế giới — cần nhiều mô hình khác nhau',
  notation:'World ≈ Model(World) — imperfect map',
  desc:'Mental models (Charlie Munger) là các mô hình đơn giản hóa về cách thế giới hoạt động — công cụ tư duy giúp hiểu và dự đoán. Cần một "bộ công cụ" đa dạng từ nhiều lĩnh vực để tránh bóp méo thực tế.',
  points:['Mỗi mô hình là đúng một phần và sai một phần','Cần mô hình từ nhiều lĩnh vực: vật lý, sinh học, kinh tế, tâm lý','Lưới tư duy (latticework): kết hợp mô hình để hiểu phức tạp','Munger: người chỉ có búa sẽ thấy mọi thứ đều là đinh'],
  example:'Cùng một tình huống, nhiều mô hình:\nMô hình kinh tế: "Người ta hành động vì incentive"\nMô hình tâm lý: "Người ta hành động vì thiên kiến nhận thức"\nMô hình tiến hóa: "Người ta hành động vì heuristic tiến hóa"\n→ Tất cả đúng một phần → cần kết hợp\n\nMunger: "Ai chỉ biết kinh tế học không giỏi kinh tế"',
  formula:'Good thinking = latticework of models from multiple domains',
  related:['Tư duy hệ thống','Cognitive Biases','Critical Thinking']},

{id:86,cat:'c9',
  title:'Occam\'s Razor',en:"Occam's Razor (Parsimony)",
  tagline:'Trong các giả thuyết tương đương, chọn cái đơn giản nhất',
  notation:'entia non sunt multiplicanda praeter necessitatem',
  desc:'"Dao cạo Occam" (William of Ockham, thế kỷ 14): "Không nhân thực thể quá mức cần thiết." Khi các giả thuyết giải thích bằng chứng tương đương nhau, ưu tiên giải thuyết đơn giản nhất — ít giả định nhất.',
  points:['Đơn giản ≠ đúng hơn — chỉ ưu tiên khi giải thích như nhau','Liên quan đến parsimony trong khoa học','Không nên đơn giản hóa quá mức (Hitchens Counter-Razor)','Dùng trong khoa học: mô hình đơn giản hơn được ưu tiên'],
  example:'"Thiên thể chuyển động vì..." \n• Ptolemy: hệ phức tạp epicycles\n• Copernicus/Newton: lực hấp dẫn đơn giản hơn → ưu tiên\n→ Không phải Ptolemy sai hoàn toàn, nhưng Newton đơn giản hơn và dự đoán tốt hơn\n\nY học:\n"Tôi bị đau đầu vì... khối u não (phức tạp) hay mệt mỏi/stress (đơn giản)?"\n→ Occam: mệt mỏi/stress trước (rồi xem xét phức tạp hơn nếu không giải thích được)',
  formula:'Between equally predictive hypotheses, prefer H with fewer entities/assumptions',
  related:['Suy luận quy nạp tốt nhất','Parsimony','Scientific Reasoning']},

{id:87,cat:'c9',
  title:'Nguyên tắc Feynman học tập',en:'Feynman Learning Technique',
  tagline:'Nếu không giải thích đơn giản được, bạn chưa thực sự hiểu',
  notation:'Explain → identify gaps → return to source → simplify',
  desc:'Richard Feynman đề xuất kỹ thuật học tập hiệu quả nhất: giải thích khái niệm như thể dạy cho trẻ 12 tuổi. Nơi nào không giải thích được là nơi có lỗ hổng thực sự trong hiểu biết — quay lại học cho đến khi giải thích được đơn giản.',
  points:['Bước 1: Chọn khái niệm và viết ra tất cả những gì biết','Bước 2: Giải thích đơn giản như cho trẻ em','Bước 3: Xác định chỗ mắc kẹt — đó là lỗ hổng thực sự','Bước 4: Quay lại tài liệu, học lại, đơn giản hóa thêm'],
  example:'Thử giải thích Quantum Entanglement cho người 12 tuổi:\n"Hai hạt được tạo ra cùng nhau có thể có tính chất đối ngược nhau\ndù ở cách nhau bao xa. Đo một hạt thì ngay lập tức biết tính chất của hạt kia."\n\nNếu bạn không thể đơn giản hơn — bạn cần học thêm!\n\nFeynman: "Tôi không thể hiểu điều gì mà tôi không thể tạo ra được"',
  formula:'Understanding(X) ↔ Can_explain_simply(X)',
  related:['Intellectual Humility','Socratic Method','Learning']},

{id:88,cat:'c9',
  title:'Tư duy nguyên tắc đầu tiên',en:'First Principles Thinking',
  tagline:'Phá vỡ vấn đề đến nền tảng không thể phủ nhận, rồi xây từ đầu',
  notation:'Decompose → Axioms → Rebuild differently',
  desc:'Tư duy nguyên lý nền tảng (first principles): thay vì lý luận bằng loại suy (làm như người khác đã làm), phân tích vấn đề xuống đến các sự thật nền tảng không thể chối cãi, rồi xây dựng lập luận từ đó. Elon Musk và Aristotle đều dùng.',
  points:['Hỏi "Điều gì là đúng tuyệt đối?" thay vì "Người ta thường làm gì?"','Loại bỏ giả định và thông lệ chưa được kiểm chứng','Đặc biệt mạnh khi giải quyết vấn đề mới chưa có giải pháp','Tốn kém hơn loại suy nhưng cho kết quả đột phá hơn'],
  example:'SpaceX (Elon Musk):\nLoại suy: "Rocket đắt vì công ty rocket nói vậy"\nFirst Principles: "Rocket làm từ vật liệu gì? Giá thị trường là bao nhiêu?\n→ Carbon fiber, nhôm, titan, thép — chỉ chiếm 2% giá rocket!\n→ Vấn đề ở quy trình, không phải nguyên liệu"\n→ SpaceX giảm chi phí 10x',
  formula:'Don\'t reason by analogy, reason from fundamentals',
  related:['Đặt câu hỏi đúng','Mô hình tư duy','Inversion']},

{id:89,cat:'c9',
  title:'Phân tích chi phí-lợi ích',en:'Cost-Benefit Analysis',
  tagline:'Cân nhắc mọi chi phí và lợi ích của một quyết định — kể cả ẩn',
  notation:'Decision: ΣBenefits vs ΣCosts (including opportunity costs)',
  desc:'Phân tích CBA là framework thực tiễn cho ra quyết định: liệt kê và so sánh tất cả lợi ích và chi phí của một lựa chọn, bao gồm cả cơ hội bị bỏ lỡ (opportunity costs), giá trị tương lai được chiết khấu, và chi phí ẩn.',
  points:['Opportunity cost: chi phí thực = lựa chọn tốt nhất đã từ bỏ','Sunk cost fallacy: chi phí đã bỏ không nên ảnh hưởng quyết định tương lai','Discount rate: lợi ích tương lai đáng ít hơn lợi ích hiện tại','Externalities: chi phí/lợi ích cho bên thứ ba'],
  example:'Quyết định: Học sau đại học\nChi phí trực tiếp: học phí, sinh hoạt\nChi phí cơ hội: 4 năm lương bị bỏ lỡ\nLợi ích: lương cao hơn tương lai, kỹ năng, mạng lưới\n\nQuyết định: Dừng dự án đang làm\n→ Sunk cost (đã đầu tư): KHÔNG liên quan đến quyết định tiếp theo!\n→ Chỉ hỏi: "Tiếp tục hay dừng tốt hơn từ đây?"',
  formula:'Net Value = PV(Benefits) - PV(Costs) - Opportunity Costs',
  related:['Suy luận thực tiễn','Decision Theory','Opportunity Cost']},

{id:90,cat:'c9',
  title:'Lý luận đạo đức',en:'Ethical Reasoning',
  tagline:'Các khung logic để đánh giá hành động đúng và sai',
  notation:'Consequentialism, Deontology, Virtue Ethics',
  desc:'Lý luận đạo đức áp dụng logic vào câu hỏi về điều đúng/sai. Ba framework chính: Consequentialism (kết quả), Deontology (nghĩa vụ/quy tắc), Virtue Ethics (đức tính). Mỗi framework cho kết quả khác nhau trong tình huống khó.',
  points:['Consequentialism: hành động đúng = tối đa hóa kết quả tốt','Deontology (Kant): hành động đúng = tuân theo quy tắc đúng','Virtue Ethics: hành động đúng = người tốt sẽ làm gì?','Trolley Problem: không có câu trả lời đúng — khám phá trực giác đạo đức'],
  example:'Trolley Problem:\nCó thể giết 1 để cứu 5?\nConsequentialism: có (5 > 1)\nDeontology: không (không được dùng người làm phương tiện)\nVirtue: người dũng cảm/nhân ái sẽ làm gì?\n\nCategorical Imperative (Kant):\n"Hãy hành động như thể nguyên tắc của bạn có thể trở thành luật tổng quát"\n→ Có thể nói dối để cứu người? Kant: không — nếu mọi người nói dối, ngôn ngữ mất nghĩa',
  formula:'C: max Σwelfare; D: follow categorical imperative; V: what would virtuous person do?',
  related:['Lý luận thực tiễn','Triết học','Nhận thức luận']},

{id:91,cat:'c9',
  title:'Tư duy xác suất ứng dụng',en:'Applied Probabilistic Thinking',
  tagline:'Đưa ra quyết định tốt hơn bằng cách nghĩ về xác suất và giá trị kỳ vọng',
  notation:'EV = Σ P(outcome_i) × value(outcome_i)',
  desc:'Giá trị kỳ vọng (Expected Value) = tổng (xác suất × kết quả) của tất cả kịch bản. Đây là nền tảng của ra quyết định dưới bất định. Quyết định tốt không đảm bảo kết quả tốt — nhưng tối đa hóa EV là chiến lược đúng dài hạn.',
  points:['EV = Σ P(i) × V(i) qua tất cả kết quả có thể','Quyết định tốt = tối đa hóa EV, không phải outcome tốt nhất','Đánh giá quyết định bằng quá trình ra quyết định, không chỉ kết quả','Kelly Criterion: phân bổ vốn tối ưu theo xác suất và payoff'],
  example:'Nên mua bảo hiểm xe không?\n• Không mua: EV = -P(accident)×Cost(accident)\n• Mua: EV = -Premium (chắc chắn)\n→ Mua nếu: Premium < P(accident) × Cost × Risk_aversion_factor\n\nPoker:\n• Pot $100, call $20 để win\n• Nếu P(win) > 20/120 = 16.7% → call là đúng về EV\n• Dù có thể thua ván này',
  formula:'EV = Σi P(outcome_i) × Value(outcome_i)',
  related:['Tư duy xác suất','Lý thuyết quyết định','Bayesian Reasoning']},

{id:92,cat:'c9',
  title:'Khung tham chiếu và Reframing',en:'Reference Frames and Reframing',
  tagline:'Cùng một thực tế, nhìn từ khung khác nhau cho insight khác nhau',
  notation:'Problem P from frame F1 vs F2 vs F3',
  desc:'Cùng một thực tế có thể được đặt trong nhiều khung tham chiếu khác nhau — mỗi khung làm nổi bật những khía cạnh khác nhau. Chuyển khung (reframing) là công cụ mạnh để phá vỡ lối mòn tư duy và tìm giải pháp mới.',
  points:['Khung tiêu cực và tích cực: "cốc nửa đầy/nửa vơi"','Mức độ trừu tượng: zoom in/zoom out thay đổi insight','Khung không gian và thời gian: nhìn từ 10 năm sau?','Perspective-taking: đặt mình vào vị trí người khác'],
  example:'Thay đổi khung không gian:\n"Sản phẩm thất bại ở Việt Nam" (cục bộ)\nvs "Sản phẩm phù hợp với thị trường phát triển hơn" (toàn cầu)\n\nThay đổi khung thời gian:\n"Chúng ta đang mất thị phần" (ngắn hạn)\nvs "Chúng ta đang đầu tư vào loyalty dài hạn" (dài hạn)\n\nProblem → Opportunity:\n"Toyota hết xe giao" → "Toyota có demand quá lớn cần mở rộng sản xuất"',
  formula:'Reframe(Problem) = new_perspective → new_solutions',
  related:['Đặt câu hỏi đúng','Mental Models','Critical Thinking']},

{id:93,cat:'c10',core:true,
  title:'Metacognition',en:'Metacognition',
  tagline:'Tư duy về tư duy của chính mình',
  notation:'Think(Think(X)) = metacognitive awareness',
  desc:'Siêu nhận thức (metacognition, Flavell) là khả năng tư duy về quá trình tư duy của chính mình — nhận thức về cách mình học, suy nghĩ, và giải quyết vấn đề. Đây là kỹ năng học tập và tư duy cao cấp nhất.',
  points:['Metacognitive knowledge: biết mình học/suy nghĩ như thế nào','Metacognitive regulation: kiểm soát và điều chỉnh quá trình nhận thức','Monitoring: "Tôi có thực sự hiểu không hay chỉ nghĩ là hiểu?"','Calibration: mức độ tự tin có phù hợp với khả năng thực sự không?'],
  example:'"Illusion of knowing" — cảm giác hiểu khi chưa thực sự hiểu:\nĐọc sách và gật đầu liên tục → cảm giác hiểu\nGõ sách lại từ trí nhớ → lỗ hổng hiện ra\n\nHiệu ứng Dunning-Kruger là lỗi metacognition:\nNgười kém nhất overestimate nhất\n→ Thiếu metacognitive accuracy\n\nTest yourself: cách tốt nhất để biết thực sự hiểu chưa',
  formula:'Metacognitive accuracy: |Confidence - Actual performance| → 0',
  related:['Dunning-Kruger','Intellectual Humility','Feynman Technique']},

{id:94,cat:'c10',
  title:'Thiên kiến nhận thức',en:'Cognitive Biases',
  tagline:'Các lỗi hệ thống có thể dự đoán được trong suy nghĩ và ra quyết định',
  notation:'Systematic deviation from rationality',
  desc:'Thiên kiến nhận thức (cognitive biases, Kahneman & Tversky) là các lỗi suy nghĩ có hệ thống và có thể dự đoán được — xuất phát từ heuristics (lối tắt tư duy) hữu ích nhưng không hoàn hảo.',

  example:'Anchoring:\n"Lương đề xuất: 30 triệu" → bạn counter: 35 triệu\nvs "Lương đề xuất: 50 triệu" → bạn counter: 55 triệu\n→ Con số đầu tiên ảnh hưởng mạnh\n\nAvailability:\nSau vụ tai nạn máy bay lớn → overestimate rủi ro bay\nThực tế: ô tô nguy hiểm hơn nhiều về tỷ lệ chết/km\n\nConfirmation bias:\nĐọc tin tức: 90% chọn nguồn đồng ý quan điểm đã có',

  example:'Donald Rumsfeld (2002) — nổi tiếng về Known Unknowns:\n"Có những known knowns — điều chúng ta biết chúng ta biết.\nCó những known unknowns — điều chúng ta biết chúng ta không biết.\nNhưng có cả unknown unknowns — điều chúng ta không biết là chúng ta không biết."\n\nBất định trong kinh doanh:\n• Known: tỷ lệ churn hiện tại\n• Known unknown: tỷ lệ churn năm sau\n• Unknown unknown: đối thủ đột phá mới xuất hiện',
  formula:'Risk = f(Known Unknowns); Deep Uncertainty = f(Unknown Unknowns)',

  example:'Chiến lược giá:\nMô hình A: Giảm giá → tăng thị phần\nMô hình B: Tăng giá → tăng brand equity\n\nTư duy OR: chọn A hoặc B\nTư duy tích hợp: "Khi nào giảm giá tốt? Khi nào tăng giá tốt?\nCó giải pháp nào không phải giá không? Làm thế nào để tăng cả hai?"\n→ Freemium model: cả hai cùng lúc ở segment khác nhau\n\nĐây là cách Steve Jobs nghĩ: "NOR, NEITHER" before "BOTH"',

const CAT_MAP = {};
CATS.forEach(c => CAT_MAP[c.id] = c);

let filterMode = 'all';
let searchQ = '';
let domainFilt = 'all';
let viewMode = 'grid';
let openId = null;

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  let h = `<div class="sb-sect-label">Chủ đề</div>
  <div class="sb-item on" style="--active-c:var(--c1)" onclick="setDomain('all',this)">
    <div class="sb-pip" style="background:#999"></div>Tất cả
    <span class="sb-ct">${DATA.length}</span>
  </div>`;
  CATS.forEach(c => {
    const cnt = DATA.filter(d=>d.cat===c.id).length;
    h += `<div class="sb-item" style="--active-c:${c.color}" onclick="setDomain('${c.id}',this)">
      <div class="sb-pip" style="background:${c.color}"></div>
      <span style="font-size:11px">${c.icon}</span>${c.label}
      <span class="sb-ct">${cnt}</span>
    </div>`;
  });
  sb.innerHTML = h;
}

function setDomain(id, el) {
  domainFilt = id;
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('on'));
  el.classList.add('on');
  render();
  if (id !== 'all') {
    const sec = document.getElementById('sec-'+id);
    if (sec) setTimeout(()=>sec.scrollIntoView({behavior:'smooth',block:'start'}),100);
  }
}

function render() {
  const main = document.getElementById('mainArea');
  const q = searchQ.toLowerCase();
  const coreOnly = filterMode === 'core';
  let total = 0;
  let html = '';

  CATS.forEach(cat => {
    if (domainFilt !== 'all' && domainFilt !== cat.id) return;
    const items = DATA.filter(d => {
      if (d.cat !== cat.id) return false;
      if (coreOnly && !d.core) return false;
      if (q && !(d.title.toLowerCase().includes(q)||d.tagline.toLowerCase().includes(q)||d.en.toLowerCase().includes(q)||(d.desc&&d.desc.toLowerCase().includes(q)))) return false;
      return true;
    });
    if (!items.length) return;
    total += items.length;

    html += `<div class="cat-section" id="sec-${cat.id}">
      <div class="cat-header" style="--cat-c:${cat.color};border-color:${cat.color}">
        <div class="cat-icon" style="background:${cat.bg};color:${cat.color}">${cat.icon}</div>
        <div class="cat-label-wrap">
          <div class="cat-num">${cat.num} · ${cat.en}</div>
          <div class="cat-title">${cat.label}</div>
        </div>
        <div class="cat-count">${items.length} KHÁI NIỆM</div>
      </div>
      <div class="card-grid${viewMode==='list'?' list':''}">`;

    items.forEach(item => {
      html += `<div class="ccard" onclick="openModal(${item.id})" style="--cc:${cat.color};--cc-bg:${cat.bg}">
        <div class="ccard-top">
          <span class="ccard-num">#${String(item.id).padStart(2,'0')}</span>
          ${item.core ? '<span class="ccard-badge core">★ Cốt lõi</span>' : ''}
        </div>
        <div class="ccard-title">${item.title}</div>
        <div class="ccard-en">${item.en}</div>
        <div class="ccard-tagline">${item.tagline}</div>
        <div class="ccard-notation">${item.notation}</div>
      </div>`;
    });

    html += `</div></div>`;
  });

  if (!total) {
    html = `<div class="empty-state"><h3>Không tìm thấy kết quả</h3><p>Thử từ khoá khác</p></div>`;
  }

  main.innerHTML = html;
  document.getElementById('cntBadge').textContent = `${total} khái niệm`;
}

let modalList = [];

function openModal(id) {
  const item = DATA.find(d=>d.id===id);
  if (!item) return;
  openId = id;
  const cat = CAT_MAP[item.cat];

  const q = searchQ.toLowerCase();
  const coreOnly = filterMode === 'core';
  modalList = DATA.filter(d => {
    if (domainFilt !== 'all' && d.cat !== domainFilt) return false;
    if (coreOnly && !d.core) return false;
    if (q && !(d.title.toLowerCase().includes(q)||d.tagline.toLowerCase().includes(q))) return false;
    return true;
  }).map(d=>d.id);

  renderModal(item, cat);
  document.getElementById('veil').classList.add('open');
  document.getElementById('modal').scrollTop = 0;
  document.getElementById('mStripe').style.background = cat.color;
}

function renderModal(item, cat) {
  document.getElementById('mHead').innerHTML = `
    <div class="modal-meta-row">
      <span class="modal-cat-badge" style="background:${cat.bg};color:${cat.color};border:1px solid ${cat.color}33">${cat.icon} ${cat.label}</span>
      ${item.core ? '<span class="modal-core">★ Cốt lõi</span>' : ''}
      <span class="modal-num">#${String(item.id).padStart(2,'0')}</span>
    </div>
    <div class="modal-title" style="color:${cat.color}">${item.title}</div>
    <div class="modal-en">${item.en}</div>
    <div class="modal-tagline">${item.tagline}</div>
    <div class="modal-notation-big">${item.notation}</div>`;

  let body = `<div class="msec">
    <div class="msec-lbl">Giải thích</div>
    <div class="msec-p">${item.desc}</div>
  </div>`;

  if (item.points?.length) {
    body += `<div class="msec"><div class="msec-lbl">Điểm mấu chốt</div>
      <ul class="msec-list">${item.points.map(p=>`<li>${p}</li>`).join('')}</ul></div>`;
  }
  if (item.example) {
    body += `<div class="msec"><div class="msec-lbl">Ví dụ cụ thể</div>
      <div class="msec-example"><pre style="font-family:inherit;white-space:pre-wrap;font-size:13.5px">${item.example}</pre></div></div>`;
  }
  if (item.formula) {
    body += `<div class="msec"><div class="msec-lbl">Ký hiệu / Công thức</div>
      <div class="msec-formula">${item.formula.replace(/\n/g,'<br>')}</div></div>`;
  }
  if (item.warning) {
    body += `<div class="msec"><div class="msec-lbl">Chú ý</div>
      <div class="msec-warning">⚠ ${item.warning}</div></div>`;
  }
  if (item.related?.length) {
    body += `<div class="msec"><div class="msec-lbl">Liên quan</div>
      <div class="related-chips">${item.related.map(r=>`<span class="rel-chip" onclick="findOpen('${r}')">${r}</span>`).join('')}</div></div>`;
  }

  document.getElementById('mBody').innerHTML = body;
  document.getElementById('mFoot').innerHTML = `
    <div class="nav-group">
      <button class="mbtn" onclick="navM(-1)">← Trước</button>
      <button class="mbtn" onclick="navM(1)">Sau →</button>
    </div>
    <button class="mbtn primary" onclick="closeModal()">Đóng</button>`;
}

function findOpen(title) {
  const found = DATA.find(d=>d.title.toLowerCase().includes(title.toLowerCase())||d.en.toLowerCase().includes(title.toLowerCase()));
  if (found) openModal(found.id);
}

function navM(dir) {
  const idx = modalList.indexOf(openId);
  if (idx === -1) return;
  const nxt = modalList[idx+dir];
  if (nxt !== undefined) openModal(nxt);
}

function closeModal() {
  document.getElementById('veil').classList.remove('open');
  openId = null;
}

function veilClick(e) {
  if (e.target === document.getElementById('veil')) closeModal();
}

function setView(v) {
  viewMode = v;
  document.getElementById('gBtn').classList.toggle('on', v==='grid');
  document.getElementById('lBtn').classList.toggle('on', v==='list');
  render();
}

function bindEvents() {
  document.getElementById('searchInput').addEventListener('input', e=>{
    searchQ = e.target.value; render();
  });
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', function(){
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      this.classList.add('active');
      filterMode = this.dataset.f;
      render();
    });
  });
  document.addEventListener('keydown', e=>{
    if (e.key==='Escape') closeModal();
    if (openId!==null) {
      if (e.key==='ArrowRight') navM(1);
      if (e.key==='ArrowLeft') navM(-1);
    }
  });
}

buildSidebar();
render();
bindEvents();
</script>
</body>
</html>
